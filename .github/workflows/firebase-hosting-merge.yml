# Deploy Firebase Hosting when main is pushed.
name: Deploy to Firebase Hosting on push

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-hosting-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1034625297461/locations/global/workloadIdentityPools/github-actions/providers/tsuchibue
          service_account: github-actions-deploy@tsuchibue.iam.gserviceaccount.com

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install -g firebase-tools

      - run: firebase deploy --only hosting --project tsuchibue
