.lines{display:flex;flex-direction:column;gap:10px}.row{display:grid;grid-template-columns:repeat(var(--count),minmax(0,1fr));gap:clamp(2px,.7vw,10px)}.card{container-type:inline-size;position:relative;min-width:0;min-height:276px;padding:15px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);text-align:start;cursor:pointer}.card:hover{border-color:var(--green)}.num{position:absolute;inset-inline-end:10px;top:9px;color:#aaa499;font:10px monospace}.name{padding-bottom:10px;border-bottom:1px solid #ebe7dc}.name strong{font:700 25px Georgia,serif}.name span{margin-inline-start:6px;color:var(--muted);font-size:10px}

@media(max-width:760px){main{width:calc(100% - 20px);padding-top:24px}.hero{display:block}.hero-side{align-items:start;margin-top:15px}.note-buttons{grid-template-columns:repeat(6,1fr)}.section-head{align-items:start;flex-direction:column}.actions{justify-content:start}.card{min-height:210px;padding:7px}.compact .card{min-height:50px}.transpose{align-items:stretch;flex-direction:column}.transpose button{flex:1}}
@media(max-width:460px){h1{font-size:32px}.section-head p{display:none}.note-buttons{grid-template-columns:repeat(4,1fr)}.note-btn{min-height:90px}.row{gap:3px}.card{min-height:175px}.compact .card{min-height:44px}.fullbar strong,.fullbar span{display:none}.fullbar button{flex:1}}

<body>
<main>
<header class="hero"><div><div class="topbar"><div class="eyebrow" dir="ltr">5-HOLE OCARINA · FINGERING MAKER</div></div><h1 data-i18n="title"></h1><p class="intro" data-i18n="intro"></p></div><div class="hero-side"><label class="lang">🌐 <span data-i18n="language"></span><select id="langSelect"></select></label><div class="legend"><span><i class="dot on"></i><span data-i18n="covered"></span></span><span><i class="dot"></i><span data-i18n="open"></span></span></div></div></header>
<section><div class="section-head"><div><b>01</b><h2 data-i18n="chooseNotes"></h2></div><p data-i18n="chooseHint"></p></div><div class="transpose"><div><span data-i18n="key"></span><strong id="keyName">G</strong><small id="keyOffset"></small></div><div><button id="keyDown" data-i18n="keyDown"></button><button id="keyReset" data-i18n="keyReset"></button><button id="keyUp" data-i18n="keyUp"></button></div></div><div class="note-buttons" id="notes"></div></section>
<section class="result"><div class="section-head"><div><b>02</b><h2 data-i18n="sequence"></h2></div><div class="actions">
<button id="importBtn" data-i18n="import"></button><button id="exportBtn" data-i18n="export"></button><button id="fullBtn" data-i18n="fullscreen"></button><button id="compactBtn"></button><button id="undoBtn" data-i18n="undo"></button><button id="clearBtn" data-i18n="clear"></button><button class="primary" id="playBtn"></button><input hidden id="fileInput" type="file" accept=".json,application/json">
</div></div><div class="status" id="status"></div><div id="output"></div></section>
<footer><span data-i18n="footer"></span> · <a href="https://github.com/jiuyunjun/tsuchibue" rel="noopener">GitHub</a></footer>
</main>
<script>
const N={do:{l:"do",s:"1",c:[1,2,3,4,5],h:523.25},re:{l:"re",s:"2",c:[1,3,4,5],h:587.33},mi:{l:"mi",s:"3",c:[1,2,3,5],h:659.25},fa:{l:"fa",s:"4",c:[1,3,5],h:698.46},so:{l:"so",s:"5",c:[3,4,5],h:783.99},la:{l:"la",s:"6",c:[3,5],h:880},sharpLa:{l:"♯la",s:"♯6 / ♭7",c:[5],half:[3],h:932.33},si:{l:"si",s:"7",c:[2,5],h:987.77},highDo:{l:"dȯ",high:"1",c:[5],h:1046.5},highRe:{l:"rė",high:"2",c:[],h:1174.66},flatLa:{l:"♭la",s:"♭6",c:[2,3,5],h:830.61}};
const K=Object.keys(N),STORE="tudi-fingering-sequence-v1",COMPACT="tudi-fingering-compact-v1",TRANSPOSE="tudi-fingering-transpose-v2",LANG="tudi-lang",KEYS=["C","C♯/D♭","D","D♯/E♭","E","F","F♯/G♭","G","G♯/A♭","A","A♯/B♭","B"];let seq=[],compact=false,transpose=7,ctx,playing=false,scale=1,timer=null,sources=new Set,lang="en";
const $=s=>document.querySelector(s),notes=$("#notes"),output=$("#output"),status=$("#status");
const track=(name,params)=>{try{gtag("event",name,params)}catch{}};

// i18n: ?lang= > saved choice > browser languages > English
function matchLang(code){if(!code)return null;code=code.replace("_","-");const L=Object.keys(I18N),lc=code.toLowerCase();const exact=L.find(x=>x.toLowerCase()===lc);if(exact)return exact;if(lc.startsWith("zh"))return/(tw|hk|mo|hant)/.test(lc)?"zh-TW":"zh-CN";return L.find(x=>x.split("-")[0]===lc.split("-")[0])||null}
function detectLang(){const q=matchLang(new URLSearchParams(location.search).get("lang"));if(q)return q;try{const s=matchLang(localStorage.getItem(LANG));if(s)return s}catch{}for(const l of navigator.languages||[navigator.language]){const m=matchLang(l);if(m)return m}return"en"}
function t(k,vars={}){const s=(I18N[lang]&&I18N[lang][k])??I18N.en[k]??k;return s.replace(/\{(\w+)\}/g,(_,v)=>vars[v]??"")}
function noteSub(k){return N[k].high?t("high",{n:N[k].high}):`<span dir="ltr">${N[k].s}</span>`}
function applyLang(){const d=I18N[lang];document.documentElement.lang=lang;document.documentElement.dir=d._dir||"ltr";document.title=t("title");document.querySelector('meta[name="description"]').content=t("description");document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n));status.textContent=t("autosaveOn");buildNotes();render()}
function setLang(l,user){lang=l;if(user){try{localStorage.setItem(LANG,l)}catch{}track("language_change",{language:l})}applyLang()}
const sel=$("#langSelect");Object.entries(I18N).forEach(([code,d])=>sel.add(new Option(d._name,code)));sel.onchange=()=>setLang(sel.value,true);

function valid(v){return Array.isArray(v)&&v.length<=500&&v.every(x=>x==="break"||x==="rest"||K.includes(x))}
try{const v=JSON.parse(localStorage.getItem(STORE)||"[]");if(valid(v))seq=v;compact=localStorage.getItem(COMPACT)==="true";const tr=Number(localStorage.getItem(TRANSPOSE)??7);if(Number.isInteger(tr)&&tr>=-12&&tr<=12)transpose=tr}catch{}
function save(msg=t("saved")){try{localStorage.setItem(STORE,JSON.stringify(seq));localStorage.setItem(COMPACT,String(compact));localStorage.setItem(TRANSPOSE,String(transpose));status.textContent=msg}catch{status.textContent=t("saveFailed")}}
function keyName(){return KEYS[((transpose%12)+12)%12]}function keyUI(){$("#keyName").textContent=keyName();$("#keyOffset").textContent=transpose===7?t("defaultKey"):t("semitones",{n:`${transpose>0?"+":""}${transpose}`});$("#keyDown").disabled=transpose<=-12;$("#keyUp").disabled=transpose>=12;$("#keyReset").disabled=transpose===7}
function tone(k,d=.5,delay=0){const A=window.AudioContext||window.webkitAudioContext;ctx=ctx||new A;const tm=ctx.currentTime+delay,g=ctx.createGain(),a=ctx.createOscillator(),b=ctx.createOscillator(),hz=N[k].h*Math.pow(2,transpose/12);a.type="sine";b.type="triangle";a.frequency.value=hz;b.frequency.value=hz*2.01;g.gain.setValueAtTime(.0001,tm);g.gain.exponentialRampToValueAtTime(.22,tm+.035);g.gain.setValueAtTime(.19,tm+Math.max(.05,d-.1));g.gain.exponentialRampToValueAtTime(.0001,tm+d);a.connect(g);b.connect(g);g.connect(ctx.destination);[a,b].forEach(x=>{sources.add(x);x.onended=()=>sources.delete(x);x.start(tm);x.stop(tm+d)})}
function add(k){seq.push(k);tone(k);save();render()}function br(){if(seq.length&&seq.at(-1)!=="break"){seq.push("break");save();render()}}function rest(){seq.push("rest");save();render()}
function holes(k,mini=false){const c=N[k].c,h=N[k].half||[],one=x=>`<i class="hole ${c.includes(x)?"on":""} ${h.includes(x)?"half":""}"></i>`;if(mini)return`<div class="compact-dots">${[1,2,3,4,5].map(one).join("")}</div>`;return`<div class="instrument"><div class="label">${t("front")}</div><div class="front">${[1,2,3,4].map(x=>`<div class="holewrap">${one(x)}<small>${x}</small></div>`).join("")}</div><div class="divider"></div><div class="label">${t("back")}</div><div class="back"><div class="holewrap">${one(5)}<small>5</small></div></div></div>`}
function fingering(k){const h=(N[k].half||[]).map(x=>t("halfHole",{n:x})).join(""),c=N[k].c.join("");return[h,c].filter(Boolean).join("+")||t("allOpen")}function card(k,n){if(k==="rest")return`<div class="card rest-card"><i class="num">${n}</i><strong>${compact?"—":t("restMark")}</strong>${compact?"":`<span>${t("restBeat")}</span>`}</div>`;return`<button class="card" data-key="${k}">${compact?holes(k,true):`<i class="num">${n}</i><div class="name"><strong dir="ltr">${N[k].l}</strong><span dir="auto">${noteSub(k)}</span></div>${holes(k)}<div class="formula" dir="ltr">${fingering(k)}</div><div class="hint">${t("tapToPlay")}</div>`}</button>`}
function groups(){let a=[[]],n=0;seq.forEach((k,i)=>k==="break"?a.push([]):a.at(-1).push({k,n:++n,i}));return a}
function render(){keyUI();const has=seq.some(x=>x!=="break"),playable=seq.some(x=>x!=="break"&&x!=="rest");$("#exportBtn").disabled=$("#fullBtn").disabled=$("#undoBtn").disabled=$("#clearBtn").disabled=!has;$("#playBtn").disabled=!playable;$("#playBtn").textContent=playing?t("stopPlay"):t("playAll");$("#playBtn").classList.toggle("stop",playing);$("#compactBtn").textContent=t("compact",{s:compact?t("on"):t("off")});$("#compactBtn").classList.toggle("active",compact);if(!has){output.innerHTML=`<div class="empty"><strong>${t("emptyTitle")}</strong><span>${t("emptyHint")}</span></div>`;return}const gs=groups(),text=seq.map(x=>x==="break"?"\n":x==="rest"?"—":N[x].l).join(" · ").replace(/ · \n · /g,"\n");output.innerHTML=`<div class="fullstage"><div class="fullbar"><strong>${t("fullTitle")}</strong><span>${t("fullInfo",{key:keyName(),n:gs.length})}</span><button data-act="play">${playing?t("stop"):t("play")}</button><button data-act="compact">${t("compact",{s:compact?t("on"):t("off")})}</button><button data-act="exit">${t("exitFull")}</button></div><div class="viewport"><div class="fit" style="--scale:${scale}"><div class="sequence" dir="ltr">${text.split("\n").map(x=>`<div>${x||"　"}</div>`).join("")}</div><div class="lines ${compact?"compact":""}">${gs.map(g=>`<div class="row" style="--count:${Math.max(1,g.length)}">${g.length?g.map(x=>card(x.k,x.n)).join(""):`<div>${t("emptyRow")}</div>`}</div>`).join("")}</div></div></div></div>`}
function buildNotes(){notes.innerHTML=K.map(k=>`<button class="note-btn" data-note="${k}"><strong dir="ltr">${N[k].l}</strong><span dir="auto">${noteSub(k)}</span><small dir="ltr">${fingering(k)}</small></button>`).join("")+`<button class="note-btn break-btn" data-break><strong>↵</strong><span>${t("lineBreak")}</span><small>${t("newRow")}</small></button><button class="note-btn rest-btn" data-rest><strong>—</strong><span>${t("rest")}</span><small>${t("pauseBeat")}</small></button>`}
notes.onclick=e=>{const b=e.target.closest("button");if(!b)return;b.dataset.note?add(b.dataset.note):b.hasAttribute("data-rest")?rest():br()};output.onclick=e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.key)tone(b.dataset.key);if(b.dataset.act==="play")play();if(b.dataset.act==="compact"){compact=!compact;save();render();fit()}if(b.dataset.act==="exit")document.exitFullscreen()};
function stop(){if(timer)clearTimeout(timer);timer=null;sources.forEach(x=>{try{x.stop()}catch{}});sources.clear();playing=false;render()}function play(){if(playing){stop();return}if(!seq.some(x=>x!=="break"&&x!=="rest"))return;playing=true;track("play_sequence",{notes:seq.filter(x=>K.includes(x)).length});let d=0;seq.forEach(k=>{if(k==="break")d+=.45;else if(k==="rest")d+=.58;else{tone(k,.48,d);d+=.58}});timer=setTimeout(()=>{timer=null;playing=false;render()},d*1000);render()}
$("#playBtn").onclick=play;$("#undoBtn").onclick=()=>{seq.pop();save();render()};$("#clearBtn").onclick=()=>{if(confirm(t("confirmClear"))){stop();seq=[];save();render()}};$("#compactBtn").onclick=()=>{compact=!compact;save();render()};
$("#keyDown").onclick=()=>{transpose=Math.max(-12,transpose-1);save();render()};$("#keyUp").onclick=()=>{transpose=Math.min(12,transpose+1);save();render()};$("#keyReset").onclick=()=>{transpose=7;save();render()};
$("#exportBtn").onclick=()=>{const blob=new Blob([JSON.stringify({format:"tudi-fingering",version:3,sequence:seq,transpose},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=t("fileName")+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);save(t("exported"));track("export_sequence",{length:seq.length})};
$("#importBtn").onclick=()=>$("#fileInput").click();$("#fileInput").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;try{const j=JSON.parse(await f.text()),v=j.sequence||j;if(!valid(v))throw 0;seq=v;if(Number.isInteger(j.transpose)&&j.transpose>=-12&&j.transpose<=12)transpose=j.transpose;save(t("imported",{name:f.name}));render();track("import_sequence",{length:seq.length})}catch{status.textContent=t("importFailed")}};
function fit(){const s=$(".fullstage"),c=$(".fit"),bar=$(".fullbar");if(!s||document.fullscreenElement!==s)return;scale=Math.min(1.6,(s.clientWidth-24)/c.scrollWidth,(s.clientHeight-bar.offsetHeight-24)/c.scrollHeight);c.style.setProperty("--scale",scale)}
$("#fullBtn").onclick=async()=>{const s=$(".fullstage");if(s){await s.requestFullscreen();requestAnimationFrame(fit)}};document.addEventListener("fullscreenchange",()=>{if(!document.fullscreenElement){scale=1;render()}else requestAnimationFrame(fit)});window.addEventListener("resize",fit);
lang=detectLang();sel.value=lang;applyLang();
</script>
