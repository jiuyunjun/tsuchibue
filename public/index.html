function applyLang(){const d=I18N[lang];document.documentElement.lang=lang;document.documentElement.dir=d._dir||"ltr";document.title=t("title");document.querySelector('meta[name="description"]').content=t("description");document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n));status.textContent=t("autosaveOn");buildNotes();render()}
function setLang(l,user){lang=l;if(user){try{localStorage.setItem(LANG,l)}catch{}track("language_change",{language:l})}applyLang()}
document.querySelectorAll("[data-lab]").forEach(a=>a.addEventListener("click",()=>track("visit_lazydoglab",{from:a.className||"link"})));
const sel=$("#langSelect");Object.entries(I18N).forEach(([code,d])=>sel.add(new Option(d._name,code)));sel.onchange=()=>setLang(sel.value,true);

function valid(v){return Array.isArray(v)&&v.length<=500&&v.every(x=>x==="break"||x==="rest"||K.includes(x))}
// First visit (nothing saved yet): preload a demo song, "Totoro's Stroll" (examples/龙猫散步-土笛指法-2026-07-25.json)
const DEMO=["mi","so","highDo","so","la","so","break","do","mi","so","highDo","si","la","so","break","la","la","la","la","highDo","si","la","so","break","la","so","la","so","re","mi","do","break","flatLa","flatLa","flatLa","flatLa","so","so","so","break","fa","fa","fa","re","mi","break","do","highDo","si","so","la","break","la","si","highDo","highRe","highDo","si","la","so","break","highDo","si","highDo","si","mi","highDo","si","break","so","la","si","highDo"];
seq=DEMO.slice();
try{const raw=localStorage.getItem(STORE);if(raw!==null){const v=JSON.parse(raw);if(valid(v))seq=v}compact=localStorage.getItem(COMPACT)==="true";const tr=Number(localStorage.getItem(TRANSPOSE)??7);if(Number.isInteger(tr)&&tr>=-12&&tr<=12)transpose=tr}catch{}
function save(msg=t("saved")){try{localStorage.setItem(STORE,JSON.stringify(seq));localStorage.setItem(COMPACT,String(compact));localStorage.setItem(TRANSPOSE,String(transpose));status.textContent=msg}catch{status.textContent=t("saveFailed")}}
function keyName(){return KEYS[((transpose%12)+12)%12]}function keyUI(){$("#keyName").textContent=keyName();$("#keyOffset").textContent=transpose===7?t("defaultKey"):t("semitones",{n:`${transpose>0?"+":""}${transpose}`});$("#keyDown").disabled=transpose<=-12;$("#keyUp").disabled=transpose>=12;$("#keyReset").disabled=transpose===7}
function tone(k,d=.5,delay=0){const A=window.AudioContext||window.webkitAudioContext;ctx=ctx||new A;const tm=ctx.currentTime+delay,g=ctx.createGain(),a=ctx.createOscillator(),b=ctx.createOscillator(),hz=N[k].h*Math.pow(2,transpose/12);a.type="sine";b.type="triangle";a.frequency.value=hz;b.frequency.value=hz*2.01;g.gain.setValueAtTime(.0001,tm);g.gain.exponentialRampToValueAtTime(.22,tm+.035);g.gain.setValueAtTime(.19,tm+Math.max(.05,d-.1));g.gain.exponentialRampToValueAtTime(.0001,tm+d);a.connect(g);b.connect(g);g.connect(ctx.destination);[a,b].forEach(x=>{sources.add(x);x.onended=()=>sources.delete(x);x.start(tm);x.stop(tm+d)})}
function bump(){const b=$("#dockCount");b.classList.remove("bump");void b.offsetWidth;b.classList.add("bump")}
function add(k){if(playing)stop();seq.push(k);tone(k);save();render();bump()}function br(){if(playing)stop();if(seq.length&&seq.at(-1)!=="break"){seq.push("break");save();render()}}function rest(){if(playing)stop();seq.push("rest");save();render()}
function holes(k,mini=false){const c=N[k].c,h=N[k].half||[],one=x=>`<i class="hole ${c.includes(x)?"on":""} ${h.includes(x)?"half":""}"></i>`;if(mini)return`<div class="compact-dots">${[1,2,3,4,5].map(one).join("")}</div>`;return`<div class="instrument"><div class="label">${t("front")}</div><div class="front">${[1,2,3,4].map(x=>`<div class="holewrap">${one(x)}<small>${x}</small></div>`).join("")}</div><div class="divider"></div><div class="label">${t("back")}</div><div class="back"><div class="holewrap">${one(5)}<small>5</small></div></div></div>`}
function fingering(k){const h=(N[k].half||[]).map(x=>t("halfHole",{n:x})).join(""),c=N[k].c.join("");return[h,c].filter(Boolean).join("+")||t("allOpen")}function card(k,n,i){if(k==="rest")return`<div class="card rest-card"><i class="num">${n}</i><strong>${compact?"—":t("restMark")}</strong>${compact?"":`<span>${t("restBeat")}</span>`}</div>`;return`<button class="card" aria-label="${N[k].l} · ${fingering(k)} · ${t("tapToPlay")}" data-key="${k}" data-i="${i}">${compact?holes(k,true):`<i class="num">${n}</i><div class="name"><strong dir="ltr">${N[k].l}</strong><span dir="auto">${noteSub(k)}</span></div>${holes(k)}<div class="formula" dir="ltr">${fingering(k)}</div><div class="hint">${t("tapToPlay")}</div>`}</button>`}
function groups(){let a=[[]],n=0;seq.forEach((k,i)=>k==="break"?a.push([]):a.at(-1).push({k,n:++n,i}));return a}
function render(){keyUI();const has=seq.some(x=>x!=="break"),playable=seq.some(x=>x!=="break"&&x!=="rest");$("#exportBtn").disabled=$("#fullBtn").disabled=$("#undoBtn").disabled=$("#clearBtn").disabled=!has;$("#playBtn").disabled=!playable;$("#playBtn").textContent=playing?t("stopPlay"):t("playAll");$("#playBtn").classList.toggle("stop",playing);$("#compactBtn").textContent=t("compact",{s:compact?t("on"):t("off")});$("#compactBtn").classList.toggle("active",compact);$("#dockUndo").textContent=t("undo");$("#compactBtn").setAttribute("aria-pressed",String(compact));updateDock();$("#dockUndo").title=$("#dockUndo").ariaLabel=t("undo");$("#dockUndo").disabled=!seq.length;$("#dockPlay").textContent=playing?t("stopPlay"):t("playAll");$("#dockPlay").disabled=!playable;$("#dockPlay").classList.toggle("stop",playing);$("#dockCount").textContent=seq.filter(x=>x!=="break").length;if(!has){output.innerHTML=`<div class="empty"><strong>${t("emptyTitle")}</strong><span>${t("emptyHint")}</span></div>`;return}const gs=groups(),text=seq.map(x=>x==="break"?"\n":x==="rest"?"—":N[x].l).join(" · ").replace(/ · \n · /g,"\n");const markup=`<div class="fullstage"><div class="fullbar"><strong>${t("fullTitle")}</strong><span>${t("fullInfo",{key:keyName(),n:gs.length})}</span><button data-act="play">${playing?t("stop"):t("play")}</button><button data-act="compact">${t("compact",{s:compact?t("on"):t("off")})}</button><button data-act="exit">${t("exitFull")}</button></div><div class="viewport"><div class="fit" style="--scale:${scale}"><details class="note-overview" ${(overviewOpen??!matchMedia("(max-width:760px)").matches)?"open":""}><summary>${t("noteOverview")}</summary><div class="sequence" dir="ltr">${text.split("\n").map(x=>`<div>${x||"　"}</div>`).join("")}</div></details><div class="lines ${compact?"compact":""}">${gs.map(g=>`<div class="row" style="--count:${Math.max(1,g.length)}">${g.length?g.map(x=>card(x.k,x.n,x.i)).join(""):`<div>${t("emptyRow")}</div>`}</div>`).join("")}</div></div></div></div>`;const stage=$(".fullstage");if(stage&&document.fullscreenElement===stage){const template=document.createElement("template");template.innerHTML=markup;stage.replaceChildren(...template.content.firstElementChild.childNodes);requestAnimationFrame(fit)}else output.innerHTML=markup}
function buildNotes(){const order=["do","re","mi","fa","so","la","si","highDo","highRe","flatLa","sharpLa"];notes.innerHTML=order.map(k=>`<button class="note-btn" data-note="${k}"><strong dir="ltr">${N[k].l}</strong><span dir="auto">${noteSub(k)}</span><small dir="ltr">${fingering(k)}</small></button>`).join("")+`<div class="note-tools"><button class="note-btn break-btn" data-break><strong>↵</strong><span>${t("lineBreak")}</span><small>${t("newRow")}</small></button><button class="note-btn rest-btn" data-rest><strong>—</strong><span>${t("rest")}</span><small>${t("pauseBeat")}</small></button></div>`}
notes.onclick=e=>{const b=e.target.closest("button");if(!b)return;b.dataset.note?add(b.dataset.note):b.hasAttribute("data-rest")?rest():br()};output.onclick=e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.key)tone(b.dataset.key);if(b.dataset.act==="play")play();if(b.dataset.act==="compact"){compact=!compact;save();render();fit()}if(b.dataset.act==="exit")document.exitFullscreen()};
output.addEventListener("toggle",e=>{if(e.target.matches(".note-overview")){overviewOpen=e.target.open;requestAnimationFrame(fit)}},true);
let marks=[];
// Highlight the card being played; on phones also keep it in view
function mark(i){document.querySelectorAll(".card.now").forEach(c=>c.classList.remove("now"));const c=document.querySelector(`.card[data-i="${i}"]`);if(!c)return;c.classList.add("now");if(matchMedia("(max-width:760px)").matches&&!document.fullscreenElement)c.scrollIntoView({block:"nearest",behavior:scrollBehavior()})}
function stop(){if(timer)clearTimeout(timer);timer=null;marks.forEach(clearTimeout);marks=[];sources.forEach(x=>{try{x.stop()}catch{}});sources.clear();playing=false;render()}function play(){if(playing){stop();return}if(!seq.some(x=>x!=="break"&&x!=="rest"))return;playing=true;track("play_sequence",{notes:seq.filter(x=>K.includes(x)).length});render();let d=0;seq.forEach((k,i)=>{if(k==="break")d+=.45;else if(k==="rest")d+=.58;else{tone(k,.48,d);marks.push(setTimeout(()=>mark(i),d*1000));d+=.58}});timer=setTimeout(()=>{timer=null;marks=[];playing=false;render()},d*1000)}
$("#playBtn").onclick=$("#dockPlay").onclick=play;$("#undoBtn").onclick=$("#dockUndo").onclick=()=>{if(playing)stop();seq.pop();save();render()};
const scrollBehavior=()=>matchMedia("(prefers-reduced-motion:reduce)").matches?"instant":"smooth";
function updateDock(){const reading=$(".result").getBoundingClientRect().top<innerHeight*.45;$("#dockTarget").textContent=t(reading?"chooseNotes":"sequence");$("#dockArrow").textContent=reading?"↑":"↓";$("#dockSeq").setAttribute("aria-controls",reading?"composer":"result")}
let dockFrame=0;window.addEventListener("scroll",()=>{if(!dockFrame)dockFrame=requestAnimationFrame(()=>{dockFrame=0;updateDock()})},{passive:true});window.addEventListener("resize",updateDock);
$("#dockSeq").onclick=()=>{$("#"+$("#dockSeq").getAttribute("aria-controls")).scrollIntoView({behavior:scrollBehavior(),block:"start"})};
if(!document.fullscreenEnabled)$("#fullBtn").hidden=true;$("#clearBtn").onclick=()=>{if(confirm(t("confirmClear"))){stop();seq=[];save();render()}};$("#compactBtn").onclick=()=>{compact=!compact;save();render()};
$("#keyDown").onclick=()=>{if(playing)stop();transpose=Math.max(-12,transpose-1);save();render()};$("#keyUp").onclick=()=>{if(playing)stop();transpose=Math.min(12,transpose+1);save();render()};$("#keyReset").onclick=()=>{if(playing)stop();transpose=7;save();render()};
$("#exportBtn").onclick=()=>{const blob=new Blob([JSON.stringify({format:"tudi-fingering",version:3,sequence:seq,transpose},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=t("fileName")+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);save(t("exported"));track("export_sequence",{length:seq.length})};
$("#importBtn").onclick=()=>$("#fileInput").click();$("#fileInput").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;try{const j=JSON.parse(await f.text()),v=j.sequence||j;if(!valid(v))throw 0;if(playing)stop();seq=v;if(Number.isInteger(j.transpose)&&j.transpose>=-12&&j.transpose<=12)transpose=j.transpose;save(t("imported",{name:f.name}));render();track("import_sequence",{length:seq.length})}catch{status.textContent=t("importFailed")}};
function fit(){const s=$(".fullstage"),c=$(".fit"),bar=$(".fullbar");if(!s||document.fullscreenElement!==s)return;scale=Math.min(1.6,(s.clientWidth-24)/c.scrollWidth,(s.clientHeight-bar.offsetHeight-24)/c.scrollHeight);c.style.setProperty("--scale",scale)}
$("#fullBtn").onclick=async()=>{const s=$(".fullstage");if(s){await s.requestFullscreen();requestAnimationFrame(fit)}};document.addEventListener("fullscreenchange",()=>{if(!document.fullscreenElement){scale=1;render()}else requestAnimationFrame(fit)});window.addEventListener("resize",fit);
lang=detectLang();sel.value=lang;applyLang();
</script>
</body>
